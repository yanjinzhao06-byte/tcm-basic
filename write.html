<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名解默写台">
<title>必背名解 · 默写台 · 中医基础</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top">
  <div class="top-in">
    <a class="tbtn" href="index.html">‹ 首页</a>
    <h1>必背名解 · 默写台<small id="pos">1 / 28</small></h1>
    <button class="tbtn" id="btnList">全部</button>
  </div>
</div>

<div class="wrap">

  <div class="tabs" id="tabs" hidden>
    <button data-m="read" class="on">① 看原文</button>
    <button data-m="copy">② 抄一遍</button>
    <button data-m="write">③ 遮住默写</button>
  </div>

  <div class="note" style="margin-top:14px">
    <b>默写三步法：</b>① 看——先看清楚采分点（黄色）→ ② 抄——照着抄一遍，红色是你抄漏的字 →
    ③ 默——全遮住，自己敲，交卷后逐字比。<b>三态都过了才算会。</b>
  </div>

  <div id="stage">

    <div class="mj-q">
      <div class="qk" id="chap">—</div>
      <div class="qt" id="q">—</div>
    </div>

    <!-- 看 -->
    <div id="paneRead">
      <div class="ans-box" id="ansBox"></div>
      <div class="pts" id="ptsBox"></div>
      <div class="mj-acts">
        <button class="btn" id="btnSpeak">🔊 听一遍</button>
        <button class="btn primary" id="toCopy">② 抄一遍 ›</button>
      </div>
    </div>

    <!-- 抄 -->
    <div id="paneCopy" class="hidden">
      <div class="ans-box" id="ansBox2" style="font-size:15px"></div>
      <textarea class="ta" id="taCopy" placeholder="照着上面抄一遍（不用抄标点也行）"></textarea>
      <div class="diff" id="diffCopy"></div>
      <div class="mj-acts">
        <button class="btn primary" id="toWrite">③ 遮住默写 ›</button>
      </div>
    </div>

    <!-- 默 -->
    <div id="paneWrite" class="hidden">
      <textarea class="ta" id="taWrite" placeholder="遮住上面，凭记忆写出来。写不全就写采分点。"></textarea>
      <div class="mj-acts">
        <button class="btn primary" id="btnSubmit">交卷 · 逐字比</button>
        <button class="btn" id="btnPeek">偷看一眼</button>
      </div>
      <div id="result" class="hidden">
        <div class="score" id="scoreLine"></div>
        <div class="verdict" id="verdict"></div>
        <div class="ans-box" style="margin-top:12px;font-size:15px" id="ansBox3"></div>
        <div class="pts" id="ptsBox3"></div>
        <div class="diff" id="diffWrite" style="margin-top:10px"></div>
      </div>
    </div>

  </div>

  <div class="mj-acts" style="margin-top:22px;justify-content:space-between">
    <button class="btn" id="prev">‹ 上一条</button>
    <button class="btn" id="next">下一条 ›</button>
  </div>

  <div id="listBox" class="hidden" style="margin-top:20px"></div>

  <div class="foot">
    共 28 条必背名解 ｜ 黄色是采分点，写不全时先写采分点也能拿分<br>
    表述以你手上陈建章第三版原话为准，个别字句按书上微调
  </div>
</div>

<script src="data/data-mingjie.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var T = window.TCM;
  T.checkin();

  var items = MINGJIE_DATA.items;
  var idx = 0;
  var mode = 'read';

  var qid = T.qs('id');
  if (qid) {
    for (var i=0;i<items.length;i++) if (items[i].id === qid) idx = i;
  }
  var qmode = T.qs('m');
  if (qmode === 'copy' || qmode === 'write') mode = qmode;

  /* ---------- 采分点高亮 ---------- */
  function markAnswer(a, pts){
    var marks = [];
    var used = [];
    pts.forEach(function(p){
      var from = 0, pos;
      while ((pos = a.indexOf(p, from)) >= 0) {
        var clash = used.some(function(u){ return !(pos + p.length <= u[0] || pos >= u[1]); });
        if (!clash) { marks.push([pos, pos + p.length]); used.push([pos, pos + p.length]); break; }
        from = pos + 1;
      }
    });
    marks.sort(function(x,y){ return x[0]-y[0]; });
    var out = '', last = 0;
    marks.forEach(function(m){
      if (m[0] < last) return;
      out += T.esc(a.slice(last, m[0]));
      out += '<mark>' + T.esc(a.slice(m[0], m[1])) + '</mark>';
      last = m[1];
    });
    out += T.esc(a.slice(last));
    return out;
  }

  function show(){
    var it = items[idx];
    document.getElementById('pos').textContent = (idx+1) + ' / ' + items.length;
    document.getElementById('chap').textContent = it.chap + ' · ' + T.lvMark(it.lv);
    document.getElementById('q').textContent = it.q;

    document.getElementById('ansBox').innerHTML = markAnswer(it.a, it.pts);
    document.getElementById('ansBox2').innerHTML = markAnswer(it.a, it.pts);

    document.getElementById('ptsBox').innerHTML =
      it.pts.map(function(p){ return '<span>' + T.esc(p) + '</span>'; }).join('');

    document.getElementById('taCopy').value = '';
    document.getElementById('diffCopy').innerHTML = '';
    document.getElementById('taWrite').value = '';
    document.getElementById('result').classList.add('hidden');

    var st = T.mjStat()[it.id];
    document.getElementById('scoreLine').textContent = '';

    setMode(mode, true);
    history.replaceState(null, '', '?id=' + it.id + '&m=' + mode);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function setMode(m, silent){
    mode = m;
    var btns = document.querySelectorAll('#tabs button');
    for (var i=0;i<btns.length;i++) btns[i].classList.toggle('on', btns[i].dataset.m === m);
    document.getElementById('paneRead').classList.toggle('hidden', m !== 'read');
    document.getElementById('paneCopy').classList.toggle('hidden', m !== 'copy');
    document.getElementById('paneWrite').classList.toggle('hidden', m !== 'write');
    if (!silent) history.replaceState(null, '', '?id=' + items[idx].id + '&m=' + m);
  }

  /* ---------- 抄：实时比对 ---------- */
  document.getElementById('taCopy').addEventListener('input', function(){
    var it = items[idx];
    var v = this.value.trim();
    var box = document.getElementById('diffCopy');
    if (!v) { box.innerHTML = ''; return; }
    var r = Math.round(T.ratio(v, it.a) * 100);
    box.innerHTML = T.renderDiff(v, it.a) +
      '<div style="margin-top:6px;color:#8d8478;font-size:13px">抄对率 ' + r +
      '%　<b style="color:#b4372b">红底</b>=多写的字　<b style="color:#b4372b">红下划线</b>=漏掉的字</div>';
  });

  /* ---------- 默：交卷 ---------- */
  document.getElementById('btnSubmit').onclick = function(){
    var it = items[idx];
    var v = document.getElementById('taWrite').value.trim();
    if (!v) { alert('先写点东西再交卷。写不全就先把采分点写上。'); return; }
    var r = T.ratio(v, it.a);
    var pct = Math.round(r * 100);
    T.mjRecord(it.id, r);

    document.getElementById('result').classList.remove('hidden');
    document.getElementById('scoreLine').innerHTML = '逐字命中 <b>' + pct + '%</b>';
    var vd = document.getElementById('verdict');
    if (pct >= 90) { vd.className = 'verdict good'; vd.textContent = '✅ 过关。这条可以进复习队列了（3 天后回看一次）。'; }
    else if (pct >= 60) { vd.className = 'verdict mid'; vd.textContent = '🟡 意思对了，但字句不准。考试这样会扣分——把红下划线的地方补上，再默一遍。'; }
    else { vd.className = 'verdict bad2'; vd.textContent = '🔴 还没记住。回到「① 看原文」，把黄色采分点念三遍，然后从「② 抄一遍」重来。'; }

    document.getElementById('ansBox3').innerHTML = markAnswer(it.a, it.pts);
    document.getElementById('diffWrite').innerHTML = T.renderDiff(v, it.a);
    document.getElementById('ptsBox3').innerHTML = it.pts.map(function(p){
      var hit = T.norm(v).indexOf(T.norm(p)) >= 0;
      return '<span style="' + (hit
        ? 'border-color:#b6dfc7;background:#eaf6ef;color:#1f5f3e'
        : 'border-color:#eec4bd;background:#fbeeeb;color:#8c2c20') + '">' +
        (hit ? '✓ ' : '✗ ') + T.esc(p) + '</span>';
    }).join('');
    document.getElementById('result').scrollIntoView({behavior:'smooth', block:'nearest'});
  };

  document.getElementById('btnPeek').onclick = function(){
    var it = items[idx];
    var box = document.getElementById('result');
    box.classList.remove('hidden');
    document.getElementById('scoreLine').textContent = '（偷看不算成绩）';
    document.getElementById('verdict').className = 'verdict';
    document.getElementById('verdict').textContent = '看完请回到 ② 抄一遍，然后重新默。';
    document.getElementById('ansBox3').innerHTML = markAnswer(it.a, it.pts);
    document.getElementById('diffWrite').innerHTML = '';
    document.getElementById('ptsBox3').innerHTML = it.pts.map(function(p){
      return '<span>' + T.esc(p) + '</span>';
    }).join('');
  };

  /* ---------- 切换 ---------- */
  document.getElementById('tabs').onclick = function(e){
    var b = e.target.closest('button');
    if (b) setMode(b.dataset.m);
  };
  document.getElementById('toCopy').onclick = function(){ setMode('copy'); };
  document.getElementById('toWrite').onclick = function(){ setMode('write'); };
  document.getElementById('btnSpeak').onclick = function(){
    var it = items[idx];
    T.speak(it.q + '。' + it.a, this);
  };
  document.getElementById('prev').onclick = function(){
    idx = (idx - 1 + items.length) % items.length; show();
  };
  document.getElementById('next').onclick = function(){
    idx = (idx + 1) % items.length; show();
  };

  /* ---------- 全部列表 ---------- */
  var listOpen = false;
  document.getElementById('btnList').onclick = function(){
    listOpen = !listOpen;
    var box = document.getElementById('listBox');
    box.classList.toggle('hidden', !listOpen);
    this.textContent = listOpen ? '收起' : '全部';
    if (!listOpen) return;
    var st = T.mjStat();
    box.innerHTML = items.map(function(it, i){
      var s = st[it.id];
      var tag = s ? (Math.round((s.best||0)*100) + '%') : '未练';
      var color = s ? (s.best >= 0.9 ? '#2f7a52' : s.best >= 0.6 ? '#b98a1a' : '#b4372b') : '#8d8478';
      return '<div class="wk" data-i="' + i + '" style="cursor:pointer;display:flex;gap:10px;align-items:center">' +
        '<span class="wkn">' + (i+1) + '</span>' +
        '<strong style="flex:1 1 auto;font-size:15px">' + T.esc(it.q) + '</strong>' +
        '<span style="font-size:12px;color:' + color + '">' + tag + '</span></div>';
    }).join('');
    box.querySelectorAll('[data-i]').forEach(function(el){
      el.onclick = function(){
        idx = +el.dataset.i;
        listOpen = false;
        box.classList.add('hidden');
        document.getElementById('btnList').textContent = '全部';
        show();
      };
    });
  };

  /* 进入就显示三态 tab */
  document.getElementById('tabs').hidden = false;
  show();
})();

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
